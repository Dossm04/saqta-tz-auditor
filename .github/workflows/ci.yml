name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      LLM_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (incl. LLM pipeline on a fake model)
        run: python -m pytest -q tests
      - name: Quality eval on labeled TZ samples (offline rules)
        run: python scripts/eval.py --min-recall 0.8 --max-fp 0
